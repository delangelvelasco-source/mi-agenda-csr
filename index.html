<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b70"><title>Mi Agenda CSR</title>
<style>
:root{--blue:#2458c6;--navy:#173b70;--bg:#f3f6fb;--line:#e0e6ef;--muted:#65728a;--ink:#172033}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}header{background:linear-gradient(130deg,var(--navy),#2864bd);color:#fff;padding:22px 18px;border-radius:0 0 24px 24px}header small{font-size:11px;letter-spacing:.12em;font-weight:800;opacity:.8}h1{font-size:25px;margin:6px 0}header p{font-size:13px;opacity:.88}main{max-width:760px;margin:auto;padding:15px}button{border:0;border-radius:10px;padding:11px 13px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;font-size:14px}button.alt{background:#edf2fc;color:var(--navy);border:1px solid #d8e3fa}button.danger{background:#fff0f1;color:#b72e3b}.row,.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px}.stat b{display:block;font-size:23px}.stat span,.muted{font-size:12px;color:var(--muted)}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 2px 9px}.actions{display:flex;gap:7px;margin:12px 0}.actions button{flex:1}.cardtitle{font-weight:750;overflow-wrap:anywhere}.meta{font-size:13px;color:var(--muted);margin-top:5px}.pill{display:inline-block;border-radius:30px;background:#edf1f7;padding:4px 8px;font-size:11px}.cardbuttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.cardbuttons button{font-size:12px;padding:8px}.empty{text-align:center;padding:25px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 2px calc(7px + env(safe-area-inset-bottom));z-index:5}nav button{background:transparent;color:var(--muted);font-size:11px;padding:5px 0}nav button span{display:block;font-size:19px}nav button.active{color:var(--blue)}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d7dfeb;border-radius:10px;font:inherit;background:#fff}.field textarea{min-height:70px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.full{grid-column:1/-1}.back{display:none;position:fixed;inset:0;background:#10182780;z-index:10;align-items:flex-end;justify-content:center}.modal{width:100%;max-width:760px;background:var(--bg);padding:17px 15px calc(20px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;max-height:92dvh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font-size:18px;text-transform:none;color:var(--ink);letter-spacing:0}.toast{display:none;position:fixed;bottom:90px;left:15px;right:15px;background:#172033;color:#fff;padding:12px;border-radius:10px;text-align:center;z-index:20}.bar{height:7px;background:#e7edf5;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#16865b}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.day{padding:9px 0;background:transparent;color:var(--ink);border:1px solid transparent}.day.selected{background:var(--blue);color:#fff}.day.has{border-bottom:3px solid #2d65c7}@media(min-width:650px){.back{align-items:center;padding:20px}.modal{border-radius:18px}}
</style></head><body>
<header><div class="top"><div><small>AGENDA PERSONAL DE OPERACIÓN</small><h1>Mi Agenda CSR</h1><div id="fecha" style="font-size:12px;color:#dbe8ff"></div></div><button id="nueva">＋ Nueva</button></div><p>Organiza tu jornada, controla pendientes y da seguimiento a cada contacto.</p></header>
<main id="app"></main><nav><button data-tab="dia" class="active"><span>☀️</span>Mi día</button><button data-tab="cal"><span>📅</span>Calendario</button><button data-tab="tareas"><span>✓</span>Pendientes</button><button data-tab="contactos"><span>👥</span>Contactos</button><button data-tab="ajustes"><span>⚙️</span>Respaldo</button></nav>
<div class="back" id="back"><div class="modal"><div class="modalhead"><h2 id="tituloForm">Nuevo registro</h2><button type="button" class="alt" id="cerrar">×</button></div><form id="form"></form></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const KEY='mi-agenda-csr-v1',CATS=['Citas','Operación logística','Seguimiento a clientes','Revisión documental','Reuniones','Llamadas','Correos','Administrativo','Personal','Otros'];const $=s=>document.querySelector(s),hoy=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},sumar=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fecha=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}):'Sin fecha';let db={acts:[],tasks:[],contacts:[]},tab='dia',seleccion=hoy(),mes=hoy().slice(0,7),filtro='Pendiente';try{let x=JSON.parse(localStorage.getItem(KEY));if(x)db={acts:Array.isArray(x.acts)?x.acts:[],tasks:Array.isArray(x.tasks)?x.tasks:[],contacts:Array.isArray(x.contacts)?x.contacts:[]}}catch(e){}function guardar(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){aviso('No se pudo guardar. Exporta un respaldo.')}}function aviso(s){let x=$('#toast');x.textContent=s;x.style.display='block';clearTimeout(aviso.t);aviso.t=setTimeout(()=>x.style.display='none',2500)}function boton(t,a,c=''){return '<button type="button" class="'+c+'" data-a="'+a+'">'+t+'</button>'}function vacio(t,d){return '<div class="card empty"><b>'+t+'</b><div>'+d+'</div></div>'}function actividades(d){return db.acts.filter(x=>x.date===d&&x.status!=='Cancelada').sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
function tarjeta(x,k){let titulo=x.title||x.name,detalle=k==='acts'?fecha(x.date)+' · '+(x.start||'Sin hora')+' · '+(x.cat||'Actividad'):k==='tasks'?'Límite: '+fecha(x.due)+' · '+(x.prio||'Media'):(x.company||'Contacto');return '<article class="card"><div class="row"><div><div class="cardtitle">'+esc(titulo)+'</div><div class="meta">'+esc(detalle)+'</div></div><span class="pill">'+esc(x.status||x.prio||'Contacto')+'</span></div>'+(x.phone?'<div class="meta">Teléfono: '+esc(x.phone)+'</div>':'')+(x.email?'<div class="meta">Correo: '+esc(x.email)+'</div>':'')+(x.pending?'<div class="meta">Pendiente: '+esc(x.pending)+'</div>':'')+(x.notes?'<div class="meta">'+esc(x.notes)+'</div>':'')+'<div class="cardbuttons">'+(k==='acts'&&x.status!=='Completada'?boton('✓ Completar','completar:'+x.id):'')+(k==='tasks'?'<label><input type="checkbox" data-a="check:'+x.id+'" '+(x.status==='Completada'?'checked':'')+'> Hecha</label>':'')+boton('Editar','editar:'+k+':'+x.id,'alt')+(k==='contacts'?boton('Seguimiento','log:'+x.id,'alt'):'')+boton('Eliminar','borrar:'+k+':'+x.id,'danger')+'</div></article>'}
function render(){$('#fecha').textContent=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let h='';if(tab==='dia'){let a=actividades(hoy()),t=db.tasks.filter(x=>x.due===hoy()&&x.status!=='Cancelada'),done=a.filter(x=>x.status==='Completada').length+t.filter(x=>x.status==='Completada').length,total=a.length+t.length;h='<div class="stats"><div class="stat"><b>'+a.length+'</b><span>Actividades hoy</span></div><div class="stat"><b>'+t.filter(x=>x.status!=='Completada').length+'</b><span>Tareas abiertas</span></div><div class="stat"><b>'+(total?Math.round(done/total*100):0)+'%</b><span>Avance del día</span></div></div><div class="card"><div class="row"><b>Avance de hoy</b><b>'+done+' / '+total+'</b></div><div class="bar"><span style="width:'+(total?done/total*100:0)+'%"></span></div></div><div class="actions">'+boton('＋ Actividad','nuevo:acts')+boton('＋ Tarea','nuevo:tasks','alt')+boton('＋ Contacto','nuevo:contacts','alt')+'</div><h2>Agenda de hoy</h2>'+(a.map(x=>tarjeta(x,'acts')).join('')||vacio('Día libre','Agrega una actividad para organizar tu jornada.'))+'<h2>Tareas de hoy</h2>'+(t.map(x=>tarjeta(x,'tasks')).join('')||vacio('Sin tareas','No hay tareas registradas para hoy.'))+'<h2>Seguimientos próximos</h2>'+(db.contacts.filter(x=>x.next&&x.next<=sumar(hoy(),1)).map(x=>tarjeta(x,'contacts')).join('')||vacio('Sin seguimientos','Los próximos contactos aparecerán aquí.'))+'<h2>Actividades vencidas</h2>'+(db.acts.filter(x=>x.date<hoy()&&['Confirmada','Provisional'].includes(x.status)).map(x=>tarjeta(x,'acts')).join('')||vacio('Sin retrasos','No hay actividades vencidas.'))+'<div class="actions">'+boton('Cerrar mi jornada','cierre','alt')+'</div>'}
if(tab==='cal'){let [y,m]=mes.split('-').map(Number),first=new Date(y,m-1,1),n=new Date(y,m,0).getDate(),off=(first.getDay()+6)%7;h='<div class="row"><div><h1>Calendario</h1><div class="muted">'+first.toLocaleDateString('es-MX',{month:'long',year:'numeric'})+'</div></div>'+boton('＋ Actividad','nuevo:acts')+'</div><div class="actions">'+boton('‹','prev','alt')+boton('Hoy','hoy','alt')+boton('›','next','alt')+'</div><div class="calendar">'+['L','M','M','J','V','S','D'].map(x=>'<small>'+x+'</small>').join('')+Array.from({length:off},()=>'<span></span>').join('')+Array.from({length:n},(_,i)=>{let d=y+'-'+String(m).padStart(2,'0')+'-'+String(i+1).padStart(2,'0');return '<button class="day '+(d===seleccion?'selected ':'')+(actividades(d).length?'has':'')+'" data-a="fecha:'+d+'">'+(i+1)+'</button>'}).join('')+'</div><h2>'+fecha(seleccion)+'</h2>'+(actividades(seleccion).map(x=>tarjeta(x,'acts')).join('')||vacio('Sin actividades','Selecciona otro día o crea una cita.'))}
if(tab==='tareas'){h='<div class="row"><div><h1>Pendientes</h1><div class="muted">Prioriza y da seguimiento a tus tareas.</div></div>'+boton('＋ Tarea','nuevo:tasks')+'</div><div class="actions">'+['Pendiente','En curso','Completada','Cancelada'].map(s=>boton(s,'filtro:'+s,s===filtro?'':'alt')).join('')+'</div>'+(db.tasks.filter(x=>x.status===filtro||(filtro==='Pendiente'&&x.due<hoy()&&!['Completada','Cancelada'].includes(x.status))).sort((a,b)=>(a.due||'').localeCompare(b.due||'')).map(x=>tarjeta(x,'tasks')).join('')||vacio('Sin pendientes','Crea una tarea para comenzar.'))}
if(tab==='contactos'){h='<div class="row"><div><h1>Contactos</h1><div class="muted">Clientes, empresas y seguimientos.</div></div>'+boton('＋ Contacto','nuevo:contacts')+'</div>'+(db.contacts.map(x=>tarjeta(x,'contacts')).join('')||vacio('Sin contactos','Agrega una persona o empresa.'))}
if(tab==='ajustes'){h='<h1>Respaldo y ajustes</h1><div class="card"><b>Almacenamiento local</b><div class="meta">Los datos se guardan en este navegador y no se sincronizan entre dispositivos. Exporta respaldos periódicamente.</div><div class="cardbuttons">'+boton('Exportar JSON','exportar')+boton('Importar JSON','importar','alt')+'</div></div><div class="card"><b>Registros guardados</b><div class="meta">Actividades: '+db.acts.length+' · Tareas: '+db.tasks.length+' · Contactos: '+db.contacts.length+'</div><div class="cardbuttons">'+boton('Borrar todos los datos','limpiar','danger')+'</div></div><div class="card"><b>Mi Agenda CSR · Independiente</b><div class="meta">Sin conexión a OP360, Supabase ni bases de datos externas.</div></div>'}$('#app').innerHTML=h}
function campo(n,l,t='text',v='',opts=[],full=false,required=false){return '<div class="field '+(full?'full':'')+'"><label>'+l+'</label>'+(t==='select'?'<select name="'+n+'">'+opts.map(o=>'<option value="'+esc(o)+'" '+(o===v?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':t==='textarea'?'<textarea name="'+n+'">'+esc(v)+'</textarea>':'<input name="'+n+'" type="'+t+'" value="'+esc(v)+'" '+(required?'required':'')+'></div>'}
function abrir(k,old={}){let f='';if(k==='acts')f=campo('title','Título *','text',old.title,'',true,false,true)+'<div class="grid">'+campo('date','Fecha','date',old.date||seleccion)+campo('start','Hora','time',old.start)+campo('end','Hora final','time',old.end)+campo('cat','Categoría','select',old.cat||CATS[0],CATS)+campo('prio','Prioridad','select',old.prio||'Media',['Alta','Media','Baja'])+campo('status','Estado','select',old.status||'Confirmada',['Confirmada','Provisional','Completada','Cancelada'])+campo('company','Empresa','text',old.company)+campo('place','Lugar','text',old.place)+campo('folio','Folio / referencia','text',old.folio)+campo('notes','Notas','textarea',old.notes,'',true)+'</div>';if(k==='tasks')f=campo('title','Título *','text',old.title,'',true,false,true)+'<div class="grid">'+campo('due','Fecha límite','date',old.due||seleccion)+campo('prio','Prioridad','select',old.prio||'Media',['Alta','Media','Baja'])+campo('status','Estado','select',old.status||'Pendiente',['Pendiente','En curso','Completada','Cancelada'])+campo('cat','Categoría','select',old.cat||'Administrativo',CATS)+campo('notes','Descripción / notas','textarea',old.notes,'',true)+'</div>';if(k==='contacts')f=campo('name','Nombre *','text',old.name,'',false,true)+'<div class="grid">'+campo('company','Empresa','text',old.company)+campo('role','Puesto / área','text',old.role)+campo('phone','Teléfono','tel',old.phone)+campo('email','Correo','email',old.email)+campo('next','Próximo seguimiento','date',old.next)+campo('pending','Asunto pendiente','textarea',old.pending,'',true)+campo('notes','Notas','textarea',old.notes,'',true)+'</div>';$('#tituloForm').textContent=(old.id?'Editar ':'Nuevo ')+({acts:'actividad',tasks:'pendiente',contacts:'contacto'}[k]);$('#form').innerHTML=f+'<input type="hidden" name="kind" value="'+k+'"><input type="hidden" name="id" value="'+(old.id||'')+'"><div class="cardbuttons"><button type="button" class="alt" id="cancelar">Cancelar</button><button type="submit">Guardar registro</button></div>';$('#back').style.display='flex';$('#cancelar').onclick=()=>$('#back').style.display='none'}
$('#form').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),k=fd.get('kind'),rid=fd.get('id'),o=Object.fromEntries(fd.entries());delete o.kind;delete o.id;if(k==='acts'&&o.start&&o.end&&o.end<=o.start)return aviso('La hora final debe ser posterior a la inicial');let col=k==='acts'?'acts':k==='tasks'?'tasks':'contacts';if(rid){let x=db[col].find(x=>x.id===rid);if(x)Object.assign(x,o)}else db[col].push({...o,id:uid(),created:new Date().toISOString()});guardar();$('#back').style.display='none';render();aviso('Registro guardado')};
document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b)return;let p=b.dataset.a.split(':'),a=p[0],k=p[1],r=p[2];if(a==='nuevo')abrir(k);if(a==='editar'){let col=k==='acts'?'acts':k==='tasks'?'tasks':'contacts',x=db[col].find(x=>x.id===r);if(x)abrir(k,x)}if(a==='completar'){let x=db.acts.find(x=>x.id===k);if(x)x.status='Completada';guardar();render()}if(a==='check'){let x=db.tasks.find(x=>x.id===k);if(x)x.status=b.checked?'Completada':'Pendiente';guardar();render()}if(a==='borrar'&&confirm('¿Eliminar este registro?')){let col=k==='acts'?'acts':k==='tasks'?'tasks':'contacts';db[col]=db[col].filter(x=>x.id!==r);guardar();render()}if(a==='fecha'){seleccion=k;render()}if(a==='prev'||a==='next'){let d=new Date(mes+'-15T12:00:00');d.setMonth(d.getMonth()+(a==='prev'?-1:1));mes=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}if(a==='hoy'){seleccion=hoy();mes=seleccion.slice(0,7);render()}if(a==='filtro'){filtro=k;render()}if(a==='log'){let c=db.contacts.find(x=>x.id===k);if(c){c.notes=(c.notes?c.notes+'\n':'')+hoy()+' · Seguimiento realizado';guardar();render();aviso('Seguimiento registrado')}}if(a==='cierre'){let text='CIERRE DE JORNADA · '+fecha(hoy())+'\nActividades: '+actividades(hoy()).length+'\nTareas: '+db.tasks.filter(x=>x.due===hoy()).length;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>aviso('Resumen copiado')).catch(()=>prompt('Copia el resumen:',text));else prompt('Copia el resumen:',text)}if(a==='exportar'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),x=document.createElement('a');x.href=url;x.download='respaldo-mi-agenda-csr.json';x.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(a==='importar'){let x=document.createElement('input');x.type='file';x.accept='.json,application/json';x.onchange=()=>{let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!Array.isArray(d.acts)||!Array.isArray(d.tasks)||!Array.isArray(d.contacts))throw Error();if(confirm('¿Reemplazar datos actuales por este respaldo?')){db=d;guardar();render();aviso('Respaldo importado')}}catch(_){aviso('Archivo de respaldo no válido')}};if(x.files[0])rd.readAsText(x.files[0])};x.click()}if(a==='limpiar'&&confirm('¿Eliminar todos los datos de este navegador?')){db={acts:[],tasks:[],contacts:[]};guardar();render()}});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#nueva').onclick=()=>abrir(tab==='tareas'?'tasks':tab==='contactos'?'contacts':'acts');$('#cerrar').onclick=()=>$('#back').style.display='none';$('#back').onclick=e=>{if(e.target.id==='back')$('#back').style.display='none'};render();
})();
</script></body></html>
